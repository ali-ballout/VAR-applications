base_config: configs/base.yaml
experiment_name: shoplifting_videomae

model:
  name: MCG-NJU/videomae-base
  revision: main
  num_labels: 2
  id2label:
    0: shoplifting
    1: no_shoplifting
  label2id:
    shoplifting: 0
    no_shoplifting: 1

processor:
  name: MCG-NJU/videomae-base

video:
  clip_seconds: 4
  fps: 16
  num_frames: 16
  img_size: 224

train:
  batch_size: 4
  eval_batch_size: 4
  epochs: 5
  learning_rate: 5e-5
  weight_decay: 0.05
  warmup_ratio: 0.1
  fp16: true
  gradient_accumulation_steps: 2
  logging_steps: 10
  evaluation_strategy: epoch
  save_strategy: epoch
  metric_for_best_model: f1
  greater_is_better: true

scheduler:
  name: linear

augmentation:
  train:
    random_horizontal_flip: true
    random_resize_scale:
      min_scale: 0.8
      max_scale: 1.0
  eval:
    center_crop: true
